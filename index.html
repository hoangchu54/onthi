<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ôn thi cùng Mèo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ôn thi Mèo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #FBF6EE; --ink: #2A211B; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16110E; --ink: #F6EEE4; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; overflow: hidden; }
  .frame { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); right: env(safe-area-inset-right); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .note { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  .note img { width: 140px; }
</style>
</head>
<body>
<div class="frame"><iframe id="app" title="Ôn thi cùng Mèo" allow="autoplay; microphone"></iframe></div>
<script>
  /* ĐỔI DÒNG DƯỚI: dán link Web App (kết thúc bằng /exec) lấy ở bước Triển khai của Apps Script */
  const APP_URL = 'DAN_LINK_WEB_APP_VAO_DAY';

  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) {
    document.body.innerHTML = '<div class="note"><img src="cats/cat-cookie.webp" alt=""><b>Chưa dán link Web App</b><span>Mở file index.html, sửa dòng APP_URL thành link /exec của Apps Script.</span></div>';
  } else {
    document.getElementById('app').src = APP_URL + '?shell=1';
  }
</script>
</body>
</html>
